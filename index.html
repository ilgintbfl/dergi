<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ilgın Ticaret Borsası Fen Lisesi Dergisi- TEKNOFEN</title>
    <link rel="stylesheet" href="dflip/css/dflip.min.css">
    <link rel="stylesheet" href="dflip/css/themify-icons.min.css">
</head>
<body>

    <div id="flipbookContainer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="dflip/js/dflip.min.js"></script>

    <script>
        var pdfUrl = "dergi.pdf"; // PDF dosyanızın adı
        var options = {
            height: 800,
            duration: 800,
            backgroundColor: "#2c3e50"
            webgl: false  // 3D motorunu kapatıp 2D CSS moduna geçirir
        };
        var flipBook = $("#flipbookContainer").flipBook(pdfUrl, options);
    </script>
</body>
</html>
